function generate(){let source=window.generateSource?state.virals.find(v=>v.id===window.generateSource):null,initial=window.pending77||null;layout('AI 選題','AI 選題 ／ 結構化原創轉化','這個本機原型會產生結構化草稿；正式 SaaS 需由伺服器端 AI 抽象層執行及驗證 JSON Schema。',`<div class="grid-2"><section class="panel"><h2>設定這一次的創作條件</h2><p class="panel-note">來源只用來提煉結構、心理機制與格式，不會複製標題、字幕、腳本、故事或人物。</p><form id="generateForm" onsubmit="generateTopic(event)"><div class="form-grid"><div class="form-field"><label>賽道</label><select name="niche">${opt(NICHES,state.profile.primaryNiche)}</select></div><div class="form-field"><label>內容目標</label><select name="goal">${opt(GOALS,state.profile.contentGoal)}</select></div><div class="form-field"><label>內容主題</label><select name="theme">${opt(THEMES,initial?.contentTheme||source?.contentTheme||'教知識')}</select></div><div class="form-field"><label>流量密碼</label><select name="code">${opt(CODES,initial?.trafficCodes?.[0]||source?.trafficCodes?.[0]||'受眾')}</select></div><div class="form-field"><label>Hook 類型</label><select name="hookType">${opt(HOOKS,initial?.hookType||source?.hookType||'問題直擊')}</select></div><div class="form-field"><label>內容格式</label><select name="format"><option>口播＋畫面切換</option><option>Vlog 實測</option><option>清單圖文</option><option>情境演劇</option></select></div><div class="form-field full"><label>題材</label><input name="subject" value="${escapeHtml(initial?.title||source?.title||'')}" placeholder="例如：用 AI 縮短備課時間" required /></div><div class="form-field full"><label>差異化與系列化要求</label><textarea name="differentiate" placeholder="例如：加入自己使用前後的數字、以新手創作者為情境、可延伸成三集">${escapeHtml(initial?.differentiation||'')}</textarea></div></div><input type="hidden" name="sourceViralContentId" value="${source?.id||initial?.sourceViralContentId||''}"><div class="form-actions"><button class="btn primary">生成結構化選題</button></div></form></section><section class="panel"><h2>輸出契約</h2><p class="panel-note">成功後將驗證固定欄位，再允許收藏至我的秘笈。</p><div class="formula">title · targetAudience · contentTheme · trafficCodes[] · hook · hookType · whyItWorks · contentStructure[] · cta · seriesIdeas[] · differentiation · riskOfCopying · viralPotential</div><div class="notice">本機模式無法呼叫 AI API。這次會以同一份 JSON 契約產生規則式草稿，讓工作流可以先試用。</div></section></div><div id="generateResult"></div>`)}
function renderGeneratedTopic(t,box,sourceLabel='規則式草稿'){let required=['title','targetAudience','contentTheme','trafficCodes','hook','hookType','whyItWorks','contentStructure','cta','seriesIdeas','differentiation','copyingRisk','viralPotential'];let valid=required.every(k=>t[k]!==undefined)&&Array.isArray(t.seriesIdeas)&&t.seriesIdeas.length>=3;window.generatedTopic=t;box.innerHTML=valid?`<article class="result-card"><span class="tag">${sourceLabel}／格式驗證通過</span><h3>${escapeHtml(t.title)}</h3><p>${escapeHtml(t.hook)}</p><pre>${escapeHtml(JSON.stringify(t,null,2))}</pre><div class="form-actions"><button class="btn terracotta" onclick="saveGeneratedTopic()">收藏至我的秘笈</button></div></article>`:'<div class="empty"><strong>格式欄位不完整</strong>請重試生成。</div>'}
function generateRuleTopic(f,box){let t=topicDraft(f);t.hookType=f.hookType;t.differentiation=f.differentiate||t.differentiation;renderGeneratedTopic(t,box,'本機規則式草稿')}
async function generateTopic(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),box=document.getElementById('generateResult');box.innerHTML='<div class="panel" style="margin-top:18px">正在依條件組合結構化選題…</div>';if(window.cloudStore?.isSignedIn?.()){try{let source=window.generateSource?state.virals.find(v=>v.id===window.generateSource):null;let t=await window.cloudStore.generateTopic({creator:state.profile,sourceViralContent:source||{},theme:f.theme,trafficCode:f.code,hookType:f.hookType,format:f.format,differentiation:f.differentiate,seriesPotential:'可延伸三集以上'});renderGeneratedTopic(t,box,'伺服器端智慧服務')}catch(error){box.innerHTML=`<div class="notice">伺服器端智慧服務目前無法回應：${escapeHtml(error.message)}<br>先提供本機規則式草稿，之後可在登入並設定金鑰後重新生成。</div>`;setTimeout(()=>generateRuleTopic(f,box),800)}return}setTimeout(()=>generateRuleTopic(f,box),450)}
function library(){let tab=window.libraryTab||'topics',items=tab==='topics'?state.topics:tab==='formulas'?state.formulas:state.virals.filter(v=>state.savedViralIds.includes(v.id));let title=tab==='topics'?'收藏選題':tab==='formulas'?'收藏公式':'收藏案例';let body=`<div class="library-tabs"><button class="library-tab ${tab==='virals'?'active':''}" onclick="window.libraryTab='virals';library()">收藏案例</button><button class="library-tab ${tab==='topics'?'active':''}" onclick="window.libraryTab='topics';library()">收藏選題</button><button class="library-tab ${tab==='formulas'?'active':''}" onclick="window.libraryTab='formulas';library()">收藏公式</button><button class="library-tab ${tab==='planned'?'active':''}" onclick="window.libraryTab='planned';library()">準備拍攝</button><button class="library-tab ${tab==='published'?'active':''}" onclick="window.libraryTab='published';library()">已發布</button></div>`;if(tab==='planned'||tab==='published'){items=state.topics.filter(t=>t.status===(tab==='planned'?'PLANNED':'PUBLISHED'));title=tab==='planned'?'準備拍攝':'已發布'}if(!items.length)body+='<div class="empty"><strong>這一格秘笈還是空的</strong>從爆款雷達、七十七式或 AI 選題收進第一筆內容資產。</div>';else if(tab==='topics'||tab==='planned'||tab==='published')body+=`<div class="table-wrap"><table class="table"><thead><tr><th>題目</th><th>主題／招式</th><th>狀態</th><th>潛力</th><th></th></tr></thead><tbody>${items.map(t=>`<tr><td><strong>${escapeHtml(t.title)}</strong><div class="muted">${escapeHtml(t.targetAudience)}</div></td><td>${t.contentTheme} · ${(t.trafficCodes||[]).join('、')}</td><td>${statusTag(t.status)}</td><td>${t.viralPotential||'—'}</td><td><button class="btn tiny" onclick="openTopic('${t.id}')">編輯</button><button class="btn tiny" onclick="deleteTopic('${t.id}')">刪除</button></td></tr>`).join('')}</tbody></table></div>`;else if(tab==='formulas')body+=`<div class="topic-grid">${items.map((f,i)=>`<article class="topic-card"><span class="topic-index">公式 ${String(i+1).padStart(2,'0')}</span><h3>${escapeHtml(f.name)}</h3><p>${escapeHtml(f.formula)}</p><div class="card-bottom"><span class="tag">${f.contentTheme}</span><button class="btn tiny" onclick="deleteFormula('${f.id}')">刪除</button></div></article>`).join('')}</div>`;else body+=`<div class="table-wrap"><table class="table"><thead><tr><th>內容案例</th><th>賽道</th><th>評估</th><th></th></tr></thead><tbody>${items.map(v=>`<tr><td><strong>${escapeHtml(v.title)}</strong><div class="muted">${v.creatorName}</div></td><td>${v.niche}</td><td>${scored(v).viralScore??'未計算'}</td><td><button class="btn tiny" onclick="toggleSaveViral('${v.id}')">取消收藏</button><button class="btn tiny" onclick="navigate('analysis/${v.id}')">拆招</button></td></tr>`).join('')}</tbody></table></div>`;layout('我的秘笈','我的秘笈 ／ 收藏與內容資料庫','把案例、選題和公式留在同一個可回頭使用的地方。',body)}

function admin(){layout('爆款資料後台','管理員 ／ 人工收錄與資料驗證','此處為本機原型的管理介面。正式 SaaS 必須以 Authentication、資料隔離與資料庫 RLS 限制此功能。',`<div class="grid-2"><section class="panel"><h2>收錄爆款案例</h2><p class="panel-note">必要數字齊全才可計算內部評估分數；人工留言樣本會供拆招閣使用。</p><form onsubmit="addViral(event)"><div class="form-grid"><div class="form-field"><label>標題</label><input name="title" required /></div><div class="form-field"><label>創作者名稱</label><input name="creatorName" required /></div><div class="form-field"><label>平台</label><select name="platform">${opt(PLATFORMS,'Instagram')}</select></div><div class="form-field"><label>賽道</label><select name="niche">${opt(NICHES,state.profile.primaryNiche)}</select></div><div class="form-field"><label>粉絲數</label><input name="followers" type="number" min="0" required /></div><div class="form-field"><label>觀看數</label><input name="views" type="number" min="0" required /></div><div class="form-field"><label>按讚數</label><input name="likes" type="number" min="0" required /></div><div class="form-field"><label>留言數</label><input name="comments" type="number" min="0" required /></div><div class="form-field"><label>內容主題</label><select name="contentTheme">${opt(THEMES,'教知識')}</select></div><div class="form-field"><label>流量密碼</label><select name="code">${opt(CODES,'受眾')}</select></div><div class="form-field"><label>Hook 類型</label><select name="hookType">${opt(HOOKS,'問題直擊')}</select></div><div class="form-field"><label>封面類型</label><select name="coverType">${opt(COVERS,'大字問題')}</select></div><div class="form-field full"><label>摘要與人工貼入留言樣本</label><textarea name="summary" placeholder="一行一則留言；可供 AI 分析問題、需求、共鳴與延伸選題"></textarea></div></div><div class="form-actions"><button class="btn primary">驗證並收錄</button></div></form></section><section class="panel"><h2>收錄準則</h2><p class="panel-note">選擇「值得研究」，不是選擇「數字最大」。</p><div class="formula">完成度：粉絲數、觀看、按讚、留言<br>比較：Views / Followers 是否超出門檻<br>轉化：你的賽道、受眾與內容目標是否相關</div><div class="notice">AI Analyze 在正式版會由伺服器端 AI 層處理。此原型已提供固定五步拆解結構和安全的原創轉化邊界。</div></section></div><section class="panel" style="margin-top:18px"><div class="section-head"><div><h2>已收錄案例</h2><p>可以封存不再使用的案例。</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>案例</th><th>賽道</th><th>資料完整度</th><th>狀態</th><th></th></tr></thead><tbody>${state.virals.map(v=>`<tr><td><strong>${escapeHtml(v.title)}</strong><div class="muted">${v.creatorName}</div></td><td>${v.niche}</td><td>${v.followers&&v.views?'可計算':'不完整'}</td><td>${v.archived?'<span class="tag dark">已封存</span>':'<span class="tag">可用</span>'}</td><td><button class="btn tiny" onclick="archiveViral('${v.id}')">${v.archived?'恢復':'封存'}</button><button class="btn tiny" onclick="navigate('analysis/${v.id}')">AI Analyze</button></td></tr>`).join('')}</tbody></table></div></section>`)}
function onboarding(){let p=state.profile;layout('建立你的創作門派','ONBOARDING ／ 先設定轉化條件','完成後，藏書閣會以你的賽道、受眾與目標安排第一輪題目。',`<section class="panel" style="max-width:740px"><form onsubmit="saveProfile(event);navigate('dashboard')"><div class="form-grid"><div class="form-field"><label>你怎麼稱呼</label><input name="name" value="${escapeHtml(p.name||'')}" required /></div><div class="form-field"><label>主要賽道</label><select name="primaryNiche">${opt(NICHES,p.primaryNiche)}</select></div><div class="form-field full"><label>你想服務誰</label><input name="audienceIdentity" value="${escapeHtml(p.audienceIdentity||'')}" required /></div><div class="form-field full"><label>他們最卡的事</label><textarea name="audienceProblem">${escapeHtml(p.audienceProblem||'')}</textarea></div><div class="form-field"><label>內容目標</label><select name="contentGoal">${opt(GOALS,p.contentGoal)}</select></div></div><div class="form-actions"><button class="btn terracotta">進入藏書閣</button></div></form></section>`)}
function saveProfile(e){e.preventDefault();let f=new FormData(e.target);state.profile={...state.profile,...Object.fromEntries(f),platforms:[...e.target.querySelectorAll('[name="platforms"] option:checked')].map(o=>o.value)};save();toast('創作者設定已儲存')}
function startGenerate(id){window.generateSource=id||null;navigate('generate')}function saveTopic(t){state.topics.unshift(t);save();toast('已收藏到我的秘笈');navigate('library')}function saveGeneratedTopic(){if(window.generatedTopic)saveTopic(window.generatedTopic)}function toggleSaveViral(id){state.savedViralIds=state.savedViralIds.includes(id)?state.savedViralIds.filter(x=>x!==id):[...state.savedViralIds,id];save();toast(state.savedViralIds.includes(id)?'案例已收藏':'已取消收藏');if(route()==='library')library();else if(route()==='radar')renderRadarRows()}function openTopic(id){let t=state.topics.find(x=>x.id===id);if(!t)return;document.getElementById('modalRoot').innerHTML=`<div class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h2>編輯內容資產</h2><button class="btn icon" onclick="closeModal()">×</button></div><form onsubmit="updateTopic(event,'${id}')"><div class="form-grid"><div class="form-field full"><label>題目</label><input name="title" value="${escapeHtml(t.title)}" required></div><div class="form-field full"><label>Hook</label><textarea name="hook">${escapeHtml(t.hook)}</textarea></div><div class="form-field"><label>狀態</label><select name="status">${opt(STATUSES,t.status)}</select></div><div class="form-field"><label>內容主題</label><select name="contentTheme">${opt(THEMES,t.contentTheme)}</select></div></div><div class="form-actions"><button class="btn primary">儲存變更</button></div></form></div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}function updateTopic(e,id){e.preventDefault();let t=state.topics.find(x=>x.id===id);Object.assign(t,Object.fromEntries(new FormData(e.target)));save();closeModal();toast('內容資產已更新');library()}function deleteTopic(id){if(confirm('確定刪除這筆選題？')){state.topics=state.topics.filter(t=>t.id!==id);save();library();toast('已刪除選題')}}function deleteFormula(id){if(confirm('確定刪除這條公式？')){state.formulas=state.formulas.filter(t=>t.id!==id);save();library();toast('已刪除公式')}}
function saveFormulaFromViral(id){let v=state.virals.find(x=>x.id===id);let f={id:uid('f'),name:`${v.hookType}｜${v.contentTheme}`,formula:`${v.hookType} → 受眾卡點 → 具體過程 → 結果 → CTA`,contentTheme:v.contentTheme,trafficCodes:v.trafficCodes,hookType:v.hookType,sourceViralContentId:id,notes:'從拆招閣儲存',createdAt:Date.now()};state.formulas.unshift(f);save();toast('公式已收藏')}
async function addViral(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let v={id:uid('v'),...f,creatorHandle:'',likes:+f.likes,comments:+f.comments,followers:+f.followers,views:+f.views,velocity:60,freshness:70,repeatedFormat:60,trafficCodes:[f.code],format:'短影音',commentsSample:f.summary,archived:false,createdAt:Date.now()};if(!v.followers||!v.views){toast('粉絲數與觀看數缺一不可，避免產生誤導分數');return}if(window.cloudStore?.isSignedIn?.()){try{await window.cloudStore.adminViral(v)}catch(error){toast(error.message);return}}state.virals.unshift(v);save();toast(`案例已收錄，內部評估 ${calculateViralScore(v)} 分`);admin()}
async function archiveViral(id){let v=state.virals.find(x=>x.id===id);if(!v)return;const next=!v.archived;if(window.cloudStore?.isSignedIn?.()){try{await window.cloudStore.adminViral({action:'archive',id,archived:next})}catch(error){toast(error.message);return}}v.archived=next;save();admin();toast(v.archived?'案例已封存':'案例已恢復')}

function enhanceSelects(){document.querySelectorAll('select:not([multiple]):not([data-customized])').forEach(select=>{select.dataset.customized='true';const wrap=document.createElement('div');wrap.className='custom-select';select.parentNode.insertBefore(wrap,select);wrap.appendChild(select);const trigger=document.createElement('button');trigger.type='button';trigger.className='custom-select-trigger';trigger.setAttribute('role','combobox');trigger.setAttribute('aria-haspopup','listbox');trigger.setAttribute('aria-expanded','false');trigger.setAttribute('aria-label',select.getAttribute('aria-label')||select.previousElementSibling?.textContent||'選擇項目');const label=document.createElement('span');const chevron=document.createElement('span');chevron.className='custom-select-chevron';chevron.textContent='⌄';trigger.append(label,chevron);const menu=document.createElement('div');menu.className='custom-select-menu';menu.setAttribute('role','listbox');menu.hidden=true;const options=[...select.options];let activeIndex=Math.max(0,select.selectedIndex);const sync=()=>{const selected=select.options[select.selectedIndex]||select.options[0];label.textContent=selected?.textContent||'請選擇';menu.querySelectorAll('.custom-select-option').forEach((button,index)=>{button.classList.toggle('selected',index===select.selectedIndex);button.setAttribute('aria-selected',String(index===select.selectedIndex))})};const position=()=>{const rect=trigger.getBoundingClientRect(),height=Math.min(280,options.length*43+12),margin=12,left=Math.max(margin,Math.min(rect.left,window.innerWidth-rect.width-margin)),below=rect.bottom+8,top=below+height<=window.innerHeight-margin?below:Math.max(margin,rect.top-height-8);Object.assign(menu.style,{top:`${top}px`,left:`${left}px`,width:`${rect.width}px`})};const close=()=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false');chevron.classList.remove('open')};const open=()=>{menu.hidden=false;trigger.setAttribute('aria-expanded','true');chevron.classList.add
